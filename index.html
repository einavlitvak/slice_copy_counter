<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0f1a" />
  <meta name="description" content="A simple 1-to-N looping counter for your home screen." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Counter</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #16213e;
      --accent: #7c3aed;
      --accent2: #a855f7;
      --accent-glow: rgba(124, 58, 237, 0.35);
      --minus: #e11d48;
      --minus-glow: rgba(225, 29, 72, 0.35);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(255,255,255,0.08);
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      position: relative;
    }

    /* Ambient background blobs */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -20%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(124,58,237,0.18) 0%, transparent 70%);
      pointer-events: none;
      animation: drift1 8s ease-in-out infinite alternate;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -20%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(225,29,72,0.12) 0%, transparent 70%);
      pointer-events: none;
      animation: drift2 10s ease-in-out infinite alternate;
    }

    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(4%,6%); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-4%,-6%); } }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
      max-width: 380px;
      padding: 24px 20px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 32px;
    }

    .app-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .settings-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      color: var(--text-muted);
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .settings-btn:hover { background: var(--surface2); color: var(--text); }
    .settings-btn svg { width: 14px; height: 14px; }

    /* ── Count display ── */
    .count-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 32px;
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .count-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 30%, rgba(124,58,237,0.10) 0%, transparent 60%);
    }

    .count-number {
      font-size: clamp(120px, 40vw, 220px);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #e2d9f3 0%, var(--accent2) 50%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: transform 0.12s cubic-bezier(0.34,1.56,0.64,1), opacity 0.08s;
      user-select: none;
    }

    .count-number.bump {
      transform: scale(1.08);
    }
    .count-number.bump-down {
      transform: scale(0.93);
    }

    .count-label {
      margin-top: 8px;
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      font-weight: 400;
      user-select: none;
    }



    /* ── Buttons ── */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 22px;
      font-family: 'Inter', sans-serif;
      font-size: 52px;
      font-weight: 300;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.15s;
      border-radius: inherit;
    }

    .btn:active::after {
      background: rgba(255,255,255,0.07);
    }

    .btn:active {
      transform: scale(0.97) !important;
    }

    .btn-plus {
      height: 110px;
      background: linear-gradient(135deg, #130a2a 0%, #1e0a3d 100%);
      border: 1px solid rgba(124,58,237,0.3);
      color: var(--accent2);
      box-shadow: 0 4px 24px rgba(124,58,237,0.12), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .btn-plus:hover {
      box-shadow: 0 4px 32px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .btn-minus {
      height: 72px;
      background: linear-gradient(135deg, #1a0a10 0%, #2d0b1a 100%);
      border: 1px solid rgba(225,29,72,0.25);
      color: var(--minus);
      box-shadow: 0 4px 24px rgba(225,29,72,0.12), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .btn-minus:hover {
      box-shadow: 0 4px 32px var(--minus-glow), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    /* ── N indicator ── */
    .n-indicator {
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .n-badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent2);
    }

    /* ── Wrap flash overlay ── */
    .flash {
      position: fixed;
      inset: 0;
      background: rgba(124,58,237,0.18);
      pointer-events: none;
      opacity: 0;
      z-index: 999;
    }
    .flash.show {
      animation: flashAnim 0.4s ease-out forwards;
    }
    @keyframes flashAnim {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ── Settings modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px 28px 0 0;
      padding: 28px 28px 40px;
      width: 100%;
      max-width: 480px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.34,1.2,0.64,1);
    }
    .modal-overlay.open .modal {
      transform: translateY(0);
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 24px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .modal label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .modal input[type="number"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -moz-appearance: textfield;
      margin-bottom: 8px;
    }
    .modal input[type="number"]::-webkit-inner-spin-button,
    .modal input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .modal input[type="number"]:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .modal-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .btn-cancel {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-cancel:active { transform: scale(0.97); }

    .btn-save {
      flex: 2;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      border: none;
      border-radius: 16px;
      padding: 16px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: all 0.15s;
    }
    .btn-save:active { transform: scale(0.97); }

    /* reset button */
    .reset-btn {
      margin-top: 20px;
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .reset-btn:active { transform: scale(0.97); background: var(--bg); }
    .reset-btn svg { width: 14px; height: 14px; }

  </style>
</head>
<body>

<div class="flash" id="flash"></div>

<!-- Settings Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Set maximum (N)</div>
    <label for="nInput">Count from 1 to…</label>
    <input type="number" id="nInput" min="2" max="99999" placeholder="10" />
    <div class="modal-hint">Counter wraps back to 1 after reaching N</div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-save" id="saveBtn">Save</button>
    </div>
    <button class="reset-btn" id="resetBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 .49-3.13"></path>
      </svg>
      Reset counter to 1
    </button>
  </div>
</div>

<div class="container">
  <div class="header">
    <span class="app-title">Counter</span>
    <button class="settings-btn" id="openSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      Set N
    </button>
  </div>

  <div class="count-card" id="countCard">
    <div class="count-number" id="countNumber">1</div>
    <div class="count-label" id="countLabel">of 10</div>
  </div>

  <div class="buttons">
    <button class="btn btn-plus" id="plusBtn" aria-label="Increase">+</button>
    <button class="btn btn-minus" id="minusBtn" aria-label="Decrease">−</button>
  </div>

  <div class="n-indicator">
    <span>Max:</span>
    <span class="n-badge" id="nBadge">10</span>
  </div>
</div>

<script>
  // ── State ──
  let count = parseInt(localStorage.getItem('count') || '1');
  let N = parseInt(localStorage.getItem('N') || '10');

  // ── DOM ──
  const countNumber = document.getElementById('countNumber');
  const countLabel  = document.getElementById('countLabel');
  const nBadge      = document.getElementById('nBadge');
  const flash       = document.getElementById('flash');
  const modalOverlay= document.getElementById('modalOverlay');
  const nInput      = document.getElementById('nInput');
  const openSettings= document.getElementById('openSettings');
  const cancelBtn   = document.getElementById('cancelBtn');
  const saveBtn     = document.getElementById('saveBtn');
  const resetBtn    = document.getElementById('resetBtn');
  const plusBtn     = document.getElementById('plusBtn');
  const minusBtn    = document.getElementById('minusBtn');

  // ── Render ──
  function render(animDir) {
    countNumber.textContent = count;
    countLabel.textContent  = `of ${N}`;
    nBadge.textContent      = N;

    // bump animation
    countNumber.classList.remove('bump', 'bump-down');
    void countNumber.offsetWidth; // reflow
    countNumber.classList.add(animDir === 'up' ? 'bump' : 'bump-down');
    setTimeout(() => countNumber.classList.remove('bump', 'bump-down'), 200);

    // persist
    localStorage.setItem('count', count);
    localStorage.setItem('N', N);
  }

  function showFlash() {
    flash.classList.remove('show');
    void flash.offsetWidth;
    flash.classList.add('show');
  }

  // ── Controls ──
  plusBtn.addEventListener('click', () => {
    if (count >= N) { count = 1; showFlash(); }
    else count++;
    render('up');
  });

  minusBtn.addEventListener('click', () => {
    if (count <= 1) { count = N; showFlash(); }
    else count--;
    render('down');
  });

  // ── Settings modal ──
  openSettings.addEventListener('click', () => {
    nInput.value = N;
    modalOverlay.classList.add('open');
    setTimeout(() => nInput.focus(), 350);
  });

  function closeModal() { modalOverlay.classList.remove('open'); }

  cancelBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

  saveBtn.addEventListener('click', () => {
    const v = parseInt(nInput.value);
    if (!isNaN(v) && v >= 2) {
      N = v;
      if (count > N) count = N;
      render('up');
    }
    closeModal();
  });

  nInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveBtn.click(); });

  resetBtn.addEventListener('click', () => {
    count = 1;
    render('up');
    closeModal();
  });

  // ── Keyboard shortcuts ──
  document.addEventListener('keydown', e => {
    if (modalOverlay.classList.contains('open')) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === ' ') plusBtn.click();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') minusBtn.click();
  });

  // ── Initial render ──
  render('up');
</script>

</body>
</html>
